name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 分层与规范检查（纯 AST，无依赖）
        run: python ops/lint-plugins.py
      - name: 分层依赖（kernel/domain 方向）
        run: python ops/lint-layers.py
      - name: 密钥扫描
        run: python ops/scan-secrets.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            nonebot/requirements.txt
            ops/requirements-config-ui.txt
      - name: 装依赖
        run: pip install -r nonebot/requirements.txt -r ops/requirements-config-ui.txt
      # 下面这些都不联网、不碰生产库、几十秒跑完，天生适合当守门员
      - name: 离线回归
        env:
          QQBOT_CODE_DIR: ${{ github.workspace }}/nonebot
        run: python ops/test-nonebot-offline.py
      - name: 全链路体检（假模型）
        env:
          QQBOT_CODE_DIR: ${{ github.workspace }}/nonebot
        run: python ops/smoke-all.py
      - name: 配置面板测试
        run: python ops/test-config-ui.py
      - name: kernel 测试
        run: python ops/test-kernel.py
      - name: Engine 门面测试
        run: python ops/test-engine.py
      - name: 适配器冒烟
        run: python ops/test-console.py
      - name: console 端到端
        run: python ops/test-console-e2e.py
      - name: 身份映射测试
        run: python ops/test-identity.py
      - name: 投递 golden
        run: python ops/test-delivery.py
      - name: 审批端口
        run: python ops/test-approval.py
      - name: QQ 入站归一化
        run: python ops/test-inbound.py
      - name: companion-core 包门面
        run: python ops/test-package.py
      # 跨层接线：单层全绿但参数传错，只有这两套抓得住（docs/04 的矩阵）
      - name: 联动体检
        env:
          QQBOT_CODE_DIR: ${{ github.workspace }}/nonebot
        run: python ops/link-check.py
      - name: 插件启动
        env:
          QQBOT_CODE_DIR: ${{ github.workspace }}/nonebot
        run: python ops/smoke-plugins.py
      # 记忆契约：只读适配器（P1）
      - name: 记忆契约
        env:
          QQBOT_CODE_DIR: ${{ github.workspace }}/nonebot
        run: python ops/test-memory-port.py
      # 护栏自检：故意写违规，确认 lint 真的会红（规则不会悄悄失效）
      - name: 护栏自检
        env:
          QQBOT_CODE_DIR: ${{ github.workspace }}/nonebot
        run: python ops/test-guards.py
      # 通道无关层：换通道时真正要复用的那部分（流式/typing/超时）
      - name: 通道无关层
        env:
          QQBOT_CODE_DIR: ${{ github.workspace }}/nonebot
        run: python ops/test-runner.py
      # 真实时钟：时间相关行为被 mock 后，重启/跨天/迟到任务只有它覆盖
      - name: 真实时钟冒烟
        env:
          QQBOT_CODE_DIR: ${{ github.workspace }}/nonebot
        run: python ops/smoke-clock.py
