name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 分层与规范检查（纯 AST，无依赖）
        run: python ops/lint-plugins.py
      - name: 密钥扫描
        run: python ops/scan-secrets.py
