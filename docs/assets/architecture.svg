<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:14; }
      .box   { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.2; rx:10; }
      .blue  { fill:#eff6ff; stroke:#60a5fa; }
      .green { fill:#f0fdf4; stroke:#4ade80; }
      .amber { fill:#fffbeb; stroke:#f59e0b; }
      .title { font-size:15px; font-weight:700; fill:#0f172a; }
      .sub   { font-size:12px; fill:#475569; }
      .tiny  { font-size:11px; fill:#64748b; }
      .h1    { font-size:22px; font-weight:700; fill:#0f172a; }
      .h2    { font-size:13px; fill:#64748b; }
      .edge  { stroke:#64748b; stroke-width:1.3; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#fcfdff"/>
  <text class="h1" x="40" y="46">聊天内核 · companion</text>
  <text class="h2" x="40" y="70">内核与通道：QQ 只是其中一种接入方式</text>

  <!-- 左：QQ 通道 -->
  <rect class="box amber" x="40" y="150" width="220" height="120" rx="10"/>
  <text class="title" x="60" y="178">QQ</text>
  <text class="sub" x="60" y="200">OneBot v11</text>
  <text class="tiny" x="60" y="222">SnowLuma / NapCat / Lagrange</text>
  <text class="tiny" x="60" y="242">adapters/qq + plugins/</text>
  <text class="tiny" x="60" y="260">第三方实现，可替换</text>

  <!-- 右：console 通道 -->
  <rect class="box amber" x="940" y="150" width="220" height="120" rx="10"/>
  <text class="title" x="960" y="178">console</text>
  <text class="sub" x="960" y="200">终端</text>
  <text class="tiny" x="960" y="222">adapters/console.py</text>
  <text class="tiny" x="960" y="242">新通道的参考实现</text>
  <text class="tiny" x="960" y="260">无平台依赖</text>

  <!-- 通道 → 内核 -->
  <path class="edge" d="M260 210 L316 210"/>
  <text class="tiny" x="264" y="200">Channel</text>
  <path class="edge" d="M940 210 L884 210"/>
  <text class="tiny" x="890" y="200">Channel</text>

  <!-- 内核面板 -->
  <rect class="panel" x="320" y="110" width="580" height="520" rx="14"/>
  <text class="title" x="340" y="138">内核 · app_core</text>
  <text class="tiny" x="340" y="156">不 import 任何平台框架</text>

  <rect class="box green" x="340" y="172" width="540" height="96" rx="10"/>
  <text class="title" x="356" y="194">编排 · orchestration</text>
  <text class="sub" x="356" y="216">Engine · TurnRunner · commands · runtime</text>
  <text class="tiny" x="356" y="236">proactive_runtime · scheduler</text>
  <text class="tiny" x="356" y="254">一轮对话：typing / 流式分段 / 45 秒硬线</text>

  <rect class="box blue" x="340" y="286" width="540" height="92" rx="10"/>
  <text class="title" x="356" y="308">领域 · domain</text>
  <text class="sub" x="356" y="330">prompt · pacing · delivery · intent</text>
  <text class="tiny" x="356" y="350">mood_domain · followup_domain · textsim</text>
  <text class="tiny" x="356" y="368">纯规则，不碰 IO</text>

  <rect class="box" x="340" y="396" width="540" height="72" rx="10"/>
  <text class="title" x="356" y="418">基础设施 · infra</text>
  <text class="sub" x="356" y="440">paths · config · files · kernel</text>
  <text class="tiny" x="356" y="458">统一派生运行时路径</text>

  <rect class="box" x="340" y="486" width="540" height="72" rx="10"/>
  <text class="title" x="356" y="508">数据</text>
  <text class="sub" x="356" y="530">chat.db · livingmemory.db · learn/</text>
  <text class="tiny" x="356" y="548">消息 / 记忆 / 画像 / 知识 / 备份</text>

  <text class="tiny" x="340" y="600">分层由 lint-layers 强制：domain 不依赖 orchestration，adapters 只走门面。</text>

  <text class="h2" x="40" y="690">通道只实现三个原语：发文本、发图、显示「正在输入」。会话循环由内核统一，换通道不改业务。</text>
  <text class="tiny" x="40" y="716">仓库：github.com/Fqh22/companion-bot</text>
</svg>
