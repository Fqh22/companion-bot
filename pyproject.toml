[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-core"
version = "0.1.0"
description = "Single-user companion engine facade (M6-mini)"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "numpy>=1.26",
  "PyYAML>=6",
  "Pillow>=10",
  "pypdf>=6",
  "python-docx>=1",
  "python-pptx>=1",
  "openpyxl>=3",
  "xlsxwriter>=3",
  "lxml>=5",
]

[tool.setuptools]
package-dir = {"" = "nonebot"}

[tool.setuptools.packages.find]
where = ["nonebot"]
include = ["app_core*", "adapters*", "companion_core*"]

[tool.setuptools.package-data]
app_core = ["**/*.sql"]
